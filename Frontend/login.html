<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Immigration Visa System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <h1>🌍 Immigration Visa System</h1>
            </div>
            <ul class="navbar-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#visa-types">Visa Types</a></li>
            </ul>
        </div>
    </nav>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-wrapper">
            <!-- Login Form -->
            <div id="login-form" class="auth-form active">
                <h2>Login</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" name="email" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" required placeholder="Enter your password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </form>
                <p class="toggle-text">Don't have an account? <a href="#" onclick="toggleForms()">Register here</a></p>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="auth-form">
                <h2>Create Account</h2>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="register-name">Full Name</label>
                        <input type="text" id="register-name" name="full_name" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="register-email">Email Address</label>
                        <input type="email" id="register-email" name="email" required placeholder="your@email.com">
                    </div>

                    <!-- Personal Details -->
                    <div class="form-group">
                        <label for="register-country">Country of Origin</label>
                        <input type="text" id="register-country" name="country_of_origin" placeholder="e.g. Kenya">
                    </div>
                    <div class="form-group">
                        <label for="register-dob">Date of Birth</label>
                        <input type="date" id="register-dob" name="date_of_birth">
                    </div>
                    <div class="form-group">
                        <label for="register-passport">Passport Number</label>
                        <input type="text" id="register-passport" name="passport_number" placeholder="e.g. A12345678">
                    </div>
                    <div class="form-group">
                        <label for="register-phone">Phone Number</label>
                        <input type="tel" id="register-phone" name="phone_number" placeholder="e.g. +254712345678">
                    </div>
                    <div class="form-group">
                        <label for="register-address">Address</label>
                        <input type="text" id="register-address" name="address" placeholder="Street, City, Postal Code">
                    </div>
                    <!-- END Personal Details -->

                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" name="password" required placeholder="Choose a strong password">
                    </div>
                    <div class="form-group">
                        <label for="register-confirm">Confirm Password</label>
                        <input type="password" id="register-confirm" name="confirm_password" required placeholder="Confirm your password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
                </form>
                <p class="toggle-text">Already have an account? <a href="#" onclick="toggleForms()">Login here</a></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Immigration Visa System. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Use local backend when testing on 127.0.0.1/localhost,
        // otherwise use a relative path (same domain as deployed on Vercel)
        const API_BASE = (window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost")
            ? "http://127.0.0.1:8000"
            : "";

        function toggleForms() {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            document.querySelector('#register-form form').reset();
            loginForm.classList.toggle('active');
            registerForm.classList.toggle('active');
        }

        // Helper: safely parse a response as JSON, and surface the real
        // error (status code + raw body) if the server didn't return JSON.
        async function parseJsonSafe(response) {
            const text = await response.text();
            try {
                return { ok: response.ok, status: response.status, data: JSON.parse(text) };
            } catch (e) {
                throw new Error(
                    `Server returned status ${response.status} (non-JSON response): ${text.slice(0, 200)}`
                );
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            fetch(`${API_BASE}/api/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, password })
            })
            .then(parseJsonSafe)
            .then(({ ok, data }) => {
                if (ok && data.access_token) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Login failed: ' + (data.detail || 'Unknown error'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Login failed: ' + error.message);
            });
        }

        function handleRegister(event) {
            event.preventDefault();
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm').value;

            const countryOfOrigin = document.getElementById('register-country').value;
            const dateOfBirth = document.getElementById('register-dob').value;
            const passportNumber = document.getElementById('register-passport').value;
            const phoneNumber = document.getElementById('register-phone').value;
            const address = document.getElementById('register-address').value;

            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            fetch(`${API_BASE}/api/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    full_name: name,
                    email,
                    password,
                    country_of_origin: countryOfOrigin,
                    date_of_birth: dateOfBirth,
                    passport_number: passportNumber,
                    phone_number: phoneNumber,
                    address: address
                })
            })
            .then(parseJsonSafe)
            .then(({ ok, data }) => {
                if (ok && data.id) {
                    alert('Account created successfully! Please login.');
                    document.getElementById('register-form').reset();
                    toggleForms();
                } else {
                    alert('Registration failed: ' + (data.detail || 'Unknown error'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Registration failed: ' + error.message);
            });
        }

        // Check if already logged in
        window.addEventListener('load', () => {
            const token = localStorage.getItem('token');
            if (token) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
